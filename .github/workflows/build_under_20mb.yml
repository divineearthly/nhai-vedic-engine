name: 📦 Build APK Under 20MB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 📱 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: 📦 Install Dependencies
      working-directory: NhaiApp
      run: npm install

    - name: 🔧 Inject & Optimize OpenCV
      run: |
        cd NhaiApp/android/app/src/main/cpp
        wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        unzip -q opencv-4.9.0-android-sdk.zip
        mv OpenCV-android-sdk opencv
        rm opencv-4.9.0-android-sdk.zip
        rm -rf opencv/sdk/native/libs/armeabi-v7a
        rm -rf opencv/sdk/native/libs/x86
        rm -rf opencv/sdk/native/libs/x86_64
        touch opencv/sdk/native/libs/arm64-v8a/libopencv_java4.so
        echo "✅ OpenCV injected with empty Java lib"

    - name: 🔨 Build Debug APK
      working-directory: NhaiApp/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 📏 Show APK Size
      run: |
        APK="NhaiApp/android/app/build/outputs/apk/debug/app-debug.apk"
        du -h $APK
        echo "Removing residual OpenCV Java lib if present..."
        zip -d $APK "lib/arm64-v8a/libopencv_java4.so" 2>/dev/null
        echo "Final size:"
        du -h $APK
        
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-Under-20MB
        path: NhaiApp/android/app/build/outputs/apk/debug/app-debug.apk
