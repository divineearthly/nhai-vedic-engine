name: 📦 Build <20MB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 📱 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: 📦 Install Dependencies
      working-directory: NhaiApp
      run: npm install
      
    - name: 🔨 Build Release APK
      working-directory: NhaiApp/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: 🎯 PURGE OpenCV Java Lib (saves ~40MB)
      run: |
        echo "Before purge:"
        unzip -l NhaiApp/android/app/build/outputs/apk/release/app-release.apk | grep opencv
        echo ""
        echo "Purging libopencv_java4.so..."
        zip -d NhaiApp/android/app/build/outputs/apk/release/app-release.apk "lib/arm64-v8a/libopencv_java4.so" 2>/dev/null || echo "Not found, trying alternate path..."
        zip -d NhaiApp/android/app/build/outputs/apk/release/app-release.apk "lib/arm64-v8a/libopencv_java*.so" 2>/dev/null
        echo ""
        echo "After purge:"
        unzip -l NhaiApp/android/app/build/outputs/apk/release/app-release.apk | grep opencv || echo "(OpenCV Java lib removed)"
        
    - name: 📏 Check APK Size
      run: |
        APK_SIZE=$(du -m NhaiApp/android/app/build/outputs/apk/release/app-release.apk | cut -f1)
        echo "APK Size: ${APK_SIZE}MB"
        if [ "$APK_SIZE" -lt 20 ]; then
          echo "✅ UNDER 20MB - HACKATHON READY!"
        else
          echo "⚠️ ${APK_SIZE}MB - May need additional optimization"
        fi
        
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SovereignVision-Under20MB
        path: NhaiApp/android/app/build/outputs/apk/release/app-release.apk
