name: 📦 Build <20MB APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      
    - name: 🔧 Apply 20MB optimizations
      run: |
        git checkout 42edf06 -- NhaiApp/android/app/build.gradle
        echo "Applied purge libopencv_java4.so optimization"
        
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 📱 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: 📦 Install Dependencies
      working-directory: NhaiApp
      run: npm install
      
    - name: 🔨 Build Release APK
      working-directory: NhaiApp/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
    - name: 📏 Check APK Size
      run: |
        APK_SIZE=$(du -m NhaiApp/android/app/build/outputs/apk/release/app-release.apk | cut -f1)
        echo "APK Size: ${APK_SIZE}MB"
        if [ "$APK_SIZE" -lt 20 ]; then
          echo "✅ UNDER 20MB - HACKATHON READY!"
          echo "SIZE_OK=true" >> $GITHUB_ENV
        else
          echo "❌ OVER 20MB - Need more optimization"
          echo "SIZE_OK=false" >> $GITHUB_ENV
        fi
        
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SovereignVision-Under20MB
        path: NhaiApp/android/app/build/outputs/apk/release/app-release.apk
