name: Build Divine Earthly Sovereign AI APK

on:
  push:
    branches: [ main ]

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Set up Java 17 (Stable NDK Standard)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Node.js (Upgraded to v20 for modern Metro bundler)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd NhaiApp
        npm install

    - name: Inject & Optimize OpenCV Android SDK
      run: |
        cd NhaiApp/android/app/src/main/cpp
        echo "Downloading OpenCV for Android..."
        wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
        unzip -q opencv-4.9.0-android-sdk.zip
        mv OpenCV-android-sdk opencv
        rm opencv-4.9.0-android-sdk.zip
        
        # Size Optimization: Purge unneeded architecture binaries
        rm -rf opencv/sdk/native/libs/armeabi-v7a
        rm -rf opencv/sdk/native/libs/x86
        rm -rf opencv/sdk/native/libs/x86_64
        rm -rf opencv/sdk/native/staticlibs/armeabi-v7a
        rm -rf opencv/sdk/native/staticlibs/x86
        rm -rf opencv/sdk/native/staticlibs/x86_64

    - name: Pre-Bundle Standalone JavaScript UI Assets
      run: |
        cd NhaiApp
        # Create the local assets directory inside the Android project tree
        mkdir -p android/app/src/main/assets
        
        # Force-compile the JavaScript entry point into a hard-baked asset file
        npx react-native bundle \
          --platform android \
          --dev false \
          --entry-file index.js \
          --bundle-output android/app/src/main/assets/index.android.bundle \
          --assets-dest android/app/src/main/res

    - name: Accept Android SDK Licenses & Setup Environment
      run: |
        echo "sdk.dir=$ANDROID_HOME" > NhaiApp/android/local.properties

    - name: Compile C++ Kernels & Package Android APK
      run: |
        cd NhaiApp/android
        chmod +x gradlew
        ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

    - name: Upload Finished App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sovereign-AI-Offline-Engine
        path: NhaiApp/android/app/build/outputs/apk/debug/app-debug.apk
